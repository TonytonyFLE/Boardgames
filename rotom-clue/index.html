<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotom Clue</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ ACCUEIL ============ -->
<section id="home" class="screen">
  <div class="home-card">
    <h1 class="logo">Rotom <span>Clue</span></h1>
    <p class="tagline">Qui a fait le coup, avec quoi, et dans quelle pièce ?</p>
    <label class="field">Ton pseudo
      <input id="in-name" maxlength="18" placeholder="ex. Tony" autocomplete="nickname">
    </label>
    <button id="btn-create" class="btn big">Créer une partie</button>
    <div class="or">ou</div>
    <div class="join-row">
      <input id="in-code" maxlength="5" placeholder="CODE" autocapitalize="characters" spellcheck="false">
      <button id="btn-join" class="btn">Rejoindre</button>
    </div>
    <button id="btn-resume" class="btn ghost hidden"></button>
    <label class="check"><input type="checkbox" id="in-local"> Mode test : plusieurs onglets de ce navigateur (sans internet)</label>
    <p id="home-msg" class="msg"></p>
  </div>
  <p class="credit">Illustrations : @peebr_koifish</p>
</section>

<!-- ============ SALON ============ -->
<section id="lobby" class="screen hidden">
  <div class="lobby-card">
    <h2 class="title">Salon de la partie</h2>
    <div class="code-box">
      <div class="code-label">Code</div>
      <div id="lobby-code" class="code"></div>
      <button id="btn-copy" class="btn small">Copier le lien d'invitation</button>
      <div id="lobby-link" class="link"></div>
    </div>
    <h3>Choisis ton Rotom</h3>
    <div id="rotom-pick" class="rotom-pick"></div>
    <h3>Joueurs <span id="lobby-count"></span></h3>
    <ul id="lobby-players" class="lobby-players"></ul>
    <button id="btn-start" class="btn big hidden">Lancer la partie</button>
    <p id="lobby-wait" class="msg">En attente du lancement par l'hôte…</p>
  </div>
</section>

<!-- ============ JEU ============ -->
<section id="game" class="screen hidden">
  <header class="topbar">
    <div class="logo small">Rotom <span>Clue</span></div>
    <div class="topinfo"><span id="net-dot" class="dot"></span> Partie <b id="game-code"></b></div>
  </header>
  <main class="layout">
    <section class="board-wrap">
      <div id="board">
        <img src="assets/board.webp" class="board-img" alt="Plateau" draggable="false">
        <div id="rooms"></div>
        <button id="peebboof" title="Le Peebboof — faire une accusation"></button>
        <div id="tokens"></div>
      </div>
    </section>
    <aside class="side">
      <div id="turnbox"></div>
      <nav class="tabs">
        <button data-tab="hand" class="on">Mes cartes</button>
        <button data-tab="notes">Notes</button>
        <button data-tab="players">Joueurs</button>
        <button data-tab="log">Journal</button>
      </nav>
      <div class="pane" id="pane-hand"></div>
      <div class="pane hidden" id="pane-notes"><div id="notes"></div></div>
      <div class="pane hidden" id="pane-players"></div>
      <div class="pane hidden" id="pane-log"></div>
    </aside>
  </main>
</section>

<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toasts"></div>

<script src="lib/peerjs.min.js"></script>
<script src="js/config.js"></script>
<script src="js/geo.js"></script>
<script src="js/net.js"></script>
<script src="js/host.js"></script>
<script src="js/app.js"></script>
</body>
</html>
